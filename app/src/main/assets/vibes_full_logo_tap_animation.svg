  <script><![CDATA[
    (function () {
      var cs = document.currentScript;
      var root = cs && (cs.ownerSVGElement || cs.closest('svg'));
      if (!root) return;
      var hit = root.querySelector('.vb-hit');
      var timer;

      function play() {
        root.classList.remove('play');
        void root.getBoundingClientRect();   // flush so a quick re-tap restarts cleanly
        root.classList.add('play');
        clearTimeout(timer);
        timer = setTimeout(function () { root.classList.remove('play'); }, 1100);
      }

      hit.addEventListener('click', play);   // mouse click and touch tap
      hit.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
      });
    })();
  ]]></script>
</svg>
