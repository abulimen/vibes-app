<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="vibes-logo" viewBox="0 0 1732 693" width="1732" height="693">
  <title>Vibes</title>
  <defs>
    <clipPath id="vb-face"><path d="M453.68 106.44C485.6 103.69 519.67 107.29 549.75 118.7C590.65 134.19 625.29 157.31 652.53 191.96C710.27 265.42 717.79 371.35 667.32 450.8C644.31 487.02 615.75 512.16 578.59 533.07C551.97 548.05 520.77 556.11 490.49 558.71C458.69 561.43 424.49 558.41 394.52 546.94C354.61 531.65 323.61 511.44 295.52 478.98C280.09 461.15 268.24 440.1 258.93 418.54C250.07 398.04 244.92 375.68 242.82 353.5C235.1 271.96 276.69 187.36 345.72 143.22C378.18 122.46 415.27 109.75 453.68 106.44Z"/></clipPath>
    <linearGradient id="vb-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* Resting state = your original logo. Adding the class "play" to the root
       svg element runs the animation once (the script below does that on click / tap). */

    .vibes-logo .vb-hit { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
    .vibes-logo .vb-hit:focus-visible { outline: 2px solid #03e76c; outline-offset: 6px; }

    .vibes-logo .vb-icon  { transform-origin: 471.25px 332.75px; }
    .vibes-logo .vb-ring  { opacity: 0; transform-box: fill-box; transform-origin: center; pointer-events: none; }
    .vibes-logo .vb-eye   { transform-box: fill-box; transform-origin: 50% 100%; }
    .vibes-logo .vb-smile { transform-box: fill-box; transform-origin: 50% 0%; }
    .vibes-logo .vb-shine { transform: translateX(-100px) skewX(-20deg); pointer-events: none; }

    /* icon: soft press-in, then a small springy settle */
    .vibes-logo.play .vb-icon  { animation: vb-pop .7s cubic-bezier(.3,.7,.2,1); }
    @keyframes vb-pop {
      0%   { transform: scale(1); }
      14%  { transform: scale(.95); }
      42%  { transform: scale(1.045); }
      68%  { transform: scale(.99); }
      100% { transform: scale(1); }
    }

    /* one soft ripple leaves the icon */
    .vibes-logo.play .vb-ring  { animation: vb-ring .9s cubic-bezier(.2,.6,.3,1); }
    @keyframes vb-ring {
      0%   { transform: scale(1);    opacity: 0; }
      8%   { opacity: .5; }
      100% { transform: scale(1.28); opacity: 0; }
    }

    /* eyes act as two equalizer bars, one dips while the other rises */
    .vibes-logo.play .vb-eye   { animation-duration: .8s; animation-delay: .05s;
                                 animation-timing-function: cubic-bezier(.4,0,.2,1); }
    .vibes-logo.play .vb-eye.vb-r { animation-name: vb-eyeR; }
    .vibes-logo.play .vb-eye.vb-l { animation-name: vb-eyeL; }
    @keyframes vb-eyeR {
      0%, 100% { transform: scale(1, 1); }
      18%      { transform: scale(1.06, .84); }
      45%      { transform: scale(.97, 1.1); }
      70%      { transform: scale(1.01, .97); }
    }
    @keyframes vb-eyeL {
      0%, 100% { transform: scale(1, 1); }
      18%      { transform: scale(.95, 1.2); }
      45%      { transform: scale(1.04, .9); }
      70%      { transform: scale(.99, 1.04); }
    }

    .vibes-logo.play .vb-smile { animation: vb-smile .7s cubic-bezier(.3,.7,.2,1) .08s; }
    @keyframes vb-smile {
      0%, 100% { transform: scale(1, 1); }
      25%      { transform: scale(1.03, 1.12); }
      60%      { transform: scale(.995, .98); }
    }

    /* a quick light streak across the face */
    .vibes-logo.play .vb-shine { animation: vb-shine .7s cubic-bezier(.5,0,.2,1) .1s; }
    @keyframes vb-shine {
      0%   { transform: translateX(-100px) skewX(-20deg); }
      100% { transform: translateX(980px)  skewX(-20deg); }
    }

    /* the letters lift in a tiny wave, left to right */
    .vibes-logo.play .vb-ltr {
      animation: vb-lift .6s cubic-bezier(.3,.7,.2,1) calc(.12s + var(--i) * .045s);
    }
    @keyframes vb-lift {
      0%, 100% { transform: translateY(0); }
      35%      { transform: translateY(-7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .vibes-logo.play * { animation: none !important; }
    }
  </style>

